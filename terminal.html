<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YiCapital 易終端｜跨資產市場與研究工作台</title>
<meta name="description" content="YiCapital Terminal：Tushare 市場資料、公司研究、債券、ETF、衍生品、貨幣與全球供應鏈工作台。">
<meta property="og:type" content="website"><meta property="og:site_name" content="YiCapital">
<meta property="og:title" content="YiCapital Terminal｜跨資產市場與研究工作台">
<meta property="og:description" content="搜尋市場或證券，進入七大資產工作區與 Bloomberg 式研究功能。">
<meta property="og:image" content="https://www.yicapital.co/terminal-og.png">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://www.yicapital.co/terminal-og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/terminal-v2.css?v=20260730f">
<script src="assets/portal-config.js" defer></script>
<script src="assets/yc-i18n.js" defer></script>
<script src="assets/yc-atlas-visuals.js?v=20260730f" defer></script>
<script src="assets/yc-terminal-v2.js?v=20260731b" defer></script>
</head>
<body class="terminal-v2-page" data-terminal-lang="tw">
<a class="terminal-skip" href="#terminal-canvas">跳到工作區</a>

<main class="terminal-app" aria-label="YiCapital Terminal">
  <section class="terminal-command" aria-label="全局命令列">
    <a class="terminal-home-mark" href="terminal" aria-label="返回易終端首頁">YC</a>
    <div class="terminal-query">
      <span class="terminal-query-mark" aria-hidden="true">⌕</span>
      <label class="terminal-visually-hidden" for="terminal-search">搜尋市場、股票或功能</label>
      <input id="terminal-search" type="search" autocomplete="off" spellcheck="false"
        placeholder="搜尋市場、股票、代號或功能…  ⌘K"
        role="combobox" aria-autocomplete="list" aria-haspopup="listbox"
        aria-controls="terminal-search-results" aria-expanded="false">
      <kbd>⌘K</kbd>
      <div id="terminal-search-results" class="terminal-search-results" role="listbox" hidden></div>
    </div>
    <div id="terminal-context" class="terminal-context" aria-live="polite">
      <span class="terminal-context-code">HOME</span>
      <strong>Yi Terminal</strong>
    </div>
    <div class="terminal-command-meta">
      <label class="terminal-year-control"><span>YEAR</span><select id="terminal-year" aria-label="標準年度"></select></label>
      <span id="terminal-clock" class="terminal-clock">HKT --:--:--</span>
      <div class="terminal-language" aria-label="語言">
        <a class="on" href="terminal.html" lang="zh-Hant" aria-current="page" data-language-link>繁</a>
        <a href="cn/terminal.html" lang="zh-Hans" data-language-link>简</a>
        <a href="en/terminal.html" lang="en" data-language-link>EN</a>
      </div>
      <a class="terminal-exit" href="./" aria-label="返回 YiCapital 網站">↗</a>
    </div>
  </section>

  <nav id="terminal-workspace-tabs" class="terminal-workspace-tabs" aria-label="七大資產工作區" role="tablist"></nav>
  <nav id="terminal-function-tabs" class="terminal-function-tabs" aria-label="目前工作區功能" role="tablist"></nav>

  <div id="terminal-alert" class="terminal-alert" role="alert" hidden></div>
  <section id="terminal-canvas" class="terminal-canvas" aria-live="polite" aria-busy="true">
    <div class="terminal-loading">正在建立 Terminal 工作區…</div>
  </section>

  <footer id="terminal-statusbar" class="terminal-statusbar" aria-label="資料與系統狀態">
    <span><i class="is-pending"></i>TUSHARE CHECK</span>
    <span>WAREHOUSE 2010–2026 · BUILDING</span>
    <span>NO MISSING-AS-ZERO</span>
  </footer>

  <noscript><div class="terminal-noscript">YiCapital Terminal 需要 JavaScript；停用時不會顯示替代或推測數字。</div></noscript>
</main>
</body>
</html>
