<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YiCapital 易终端｜跨资产市场与研究工作台</title>
<meta name="description" content="YiCapital 易终端：Tushare 市场数据、公司研究、债券、ETF、衍生品、货币与全球供应链工作台。">
<meta property="og:type" content="website"><meta property="og:site_name" content="YiCapital">
<meta property="og:title" content="YiCapital 易终端｜跨资产市场与研究工作台">
<meta property="og:description" content="搜索市场或证券，进入七大资产工作区与 Bloomberg 式研究功能。">
<meta property="og:image" content="https://www.yicapital.co/terminal-og.png">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://www.yicapital.co/terminal-og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/terminal-v2.css?v=20260730c">
<script src="../assets/portal-config.js" defer></script>
<script src="../assets/yc-i18n.js" defer></script>
<script src="../assets/yc-terminal-v2.js?v=20260730c" defer></script>
</head>
<body class="terminal-v2-page" data-terminal-lang="cn">
<a class="terminal-skip" href="#terminal-canvas">跳到工作区</a>

<header class="terminal-site-header">
  <div class="terminal-site-header-inner">
    <a class="terminal-brand terminal-brand-link" href="./" aria-label="YiCapital 首页"><span class="logo">Yi<b>Capital</b></span></a>
    <nav class="terminal-site-links" aria-label="网站导航">
      <a href="insights" data-i18n="nav.insights">研究观点</a>
      <a href="forum" data-i18n="nav.forum">研究论坛</a>
      <a href="portfolios" data-i18n="nav.portfolios">组合实录</a>
      <a class="link active" href="terminal" aria-current="page" data-i18n="nav.terminal">易终端</a>
    </nav>
    <div class="terminal-site-tools">
      <a class="terminal-about" href="about" data-i18n="nav.about">关于我们</a>
      <div class="terminal-language" aria-label="语言">
        <a href="../terminal.html" lang="zh-Hant" data-language-link>繁</a>
        <a class="on" href="terminal.html" lang="zh-Hans" aria-current="page" data-language-link>简</a>
        <a href="../en/terminal.html" lang="en" data-language-link>EN</a>
      </div>
      <a href="login">登录</a>
    </div>
  </div>
</header>

<main class="terminal-app" aria-label="YiCapital 易终端">
  <section class="terminal-command" aria-label="全局命令栏">
    <div class="terminal-query">
      <span class="terminal-query-mark" aria-hidden="true">⌕</span>
      <label class="terminal-visually-hidden" for="terminal-search">搜索市场、股票、基金、债券或功能</label>
      <input id="terminal-search" type="search" autocomplete="off" spellcheck="false"
        placeholder="搜索市场、股票、代码或功能…  ⌘K"
        role="combobox" aria-autocomplete="list" aria-haspopup="listbox"
        aria-controls="terminal-search-results" aria-expanded="false">
      <kbd>⌘K</kbd>
      <div id="terminal-search-results" class="terminal-search-results" role="listbox" hidden></div>
    </div>
    <div id="terminal-context" class="terminal-context" aria-live="polite">
      <span class="terminal-context-code">MKT</span>
      <strong>Market News</strong>
    </div>
    <div class="terminal-command-meta">
      <label><span>YEAR</span><select id="terminal-year" aria-label="标准年度"></select></label>
      <span id="terminal-clock" class="terminal-clock">HKT --:--:--</span>
    </div>
  </section>

  <nav id="terminal-workspace-tabs" class="terminal-workspace-tabs" aria-label="七大资产工作区" role="tablist"></nav>
  <nav id="terminal-function-tabs" class="terminal-function-tabs" aria-label="当前工作区功能" role="tablist"></nav>
  <div id="terminal-alert" class="terminal-alert" role="alert" hidden></div>
  <section id="terminal-canvas" class="terminal-canvas" aria-live="polite" aria-busy="true">
    <div class="terminal-loading">正在建立 Terminal 工作区…</div>
  </section>
  <footer id="terminal-statusbar" class="terminal-statusbar" aria-label="数据与系统状态">
    <span><i class="is-pending"></i>TUSHARE CHECK</span>
    <span>WAREHOUSE 2010–2026 · BUILDING</span>
    <span>NO MISSING-AS-ZERO</span>
  </footer>
  <noscript><div class="terminal-noscript">YiCapital 易终端需要 JavaScript；停用时不会显示替代或推测数字。</div></noscript>
</main>
</body>
</html>
