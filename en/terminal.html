<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="/favicon.svg?v=20260802a" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260802a">
<title>YiCapital Terminal | Cross-asset market and research workspace</title>
<meta name="description" content="YiCapital Terminal: Tushare market data, stocks, debt, ETFs, derivatives, money, currencies and global supply-chain research.">
<meta property="og:type" content="website"><meta property="og:site_name" content="YiCapital">
<meta property="og:title" content="YiCapital Terminal | Cross-asset market and research workspace">
<meta property="og:description" content="Search a market or security and work across seven asset workspaces with Bloomberg-style functions.">
<meta property="og:image" content="https://www.yicapital.co/terminal-og.png?v=20260802a">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://www.yicapital.co/terminal-og.png?v=20260802a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css?v=20260802a">
<link rel="stylesheet" href="../assets/terminal-v2.css?v=20260802b">
<script src="../assets/portal-config.js" defer></script>
<script src="../assets/yc-i18n.js" defer></script>
<script src="../assets/yc-atlas-visuals.js?v=20260731e" defer></script>
<script src="../assets/yc-terminal-v2.js?v=20260731e" defer></script>
</head>
<body class="terminal-v2-page" data-terminal-lang="en">
<a class="terminal-skip" href="#terminal-canvas">Skip to workspace</a>

<main class="terminal-app" aria-label="YiCapital Terminal">
  <section class="terminal-command" aria-label="Global command bar">
    <a class="terminal-home-mark" href="/en/?dashboard=1" aria-label="Back to Dashboard home"><span class="logo">Yi<b>Capital</b></span></a>
    <div class="terminal-query">
      <span class="terminal-query-mark" aria-hidden="true">⌕</span>
      <label class="terminal-visually-hidden" for="terminal-search">Search markets, stocks or functions</label>
      <input id="terminal-search" type="search" autocomplete="off" spellcheck="false"
        placeholder="Search market, security, ticker or function…  ⌘K"
        role="combobox" aria-autocomplete="list" aria-haspopup="listbox"
        aria-controls="terminal-search-results" aria-expanded="false">
      <kbd>⌘K</kbd>
      <div id="terminal-search-results" class="terminal-search-results" role="listbox" hidden></div>
    </div>
    <div id="terminal-context" class="terminal-context" aria-live="polite">
      <span class="terminal-context-code">HOME</span>
      <strong>Yi Terminal</strong>
    </div>
    <div class="terminal-command-meta">
      <label class="terminal-year-control"><span>YEAR</span><select id="terminal-year" aria-label="Canonical year"></select></label>
      <span id="terminal-clock" class="terminal-clock">HKT --:--:--</span>
      <div class="terminal-language" aria-label="Language">
        <a href="../terminal.html" lang="zh-Hant" data-language-link>繁</a>
        <a href="../cn/terminal.html" lang="zh-Hans" data-language-link>简</a>
        <a class="on" href="terminal.html" lang="en" aria-current="page" data-language-link>EN</a>
      </div>
      <a class="terminal-exit" href="./" aria-label="Back to YiCapital website">↗</a>
    </div>
  </section>

  <nav id="terminal-workspace-tabs" class="terminal-workspace-tabs" aria-label="Seven asset workspaces" role="tablist"></nav>
  <nav id="terminal-function-tabs" class="terminal-function-tabs" aria-label="Current workspace functions" role="tablist"></nav>
  <div id="terminal-alert" class="terminal-alert" role="alert" hidden></div>
  <section id="terminal-canvas" class="terminal-canvas" aria-live="polite" aria-busy="true">
    <div class="terminal-loading">Building the Terminal workspace…</div>
  </section>
  <footer id="terminal-statusbar" class="terminal-statusbar" aria-label="Data and system status">
    <span><i class="is-pending"></i>TUSHARE CHECK</span>
    <span>WAREHOUSE 2010–2026 · BUILDING</span>
    <span>NO MISSING-AS-ZERO</span>
  </footer>
  <noscript><div class="terminal-noscript">YiCapital Terminal requires JavaScript. It never substitutes or guesses numbers when disabled.</div></noscript>
</main>
</body>
</html>
