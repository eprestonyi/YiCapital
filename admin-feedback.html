<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用戶意見 ｜ Admin ｜ YiCapital</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/portal-config.js"></script>
<script src="assets/yc-admin.js"></script>
<style>
  .fb-summary{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px;margin-bottom:20px}
  .fb-stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px}
  .fb-stat b{display:block;color:#fff;font-family:var(--sans);font-size:26px;margin-bottom:5px}
  .fb-stat span{color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.6px}
  .fb-filters{display:grid;grid-template-columns:1.5fr repeat(3,minmax(130px,.7fr)) auto;gap:10px;align-items:center}
  .fb-filters input,.fb-filters select,.fb-editor input,.fb-editor textarea,.fb-editor select{
    width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:7px;
    color:var(--txt);padding:10px 12px;font-family:var(--zh);font-size:13px}
  .fb-list{display:grid;gap:15px}
  .fb-entry{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
  .fb-entry[data-status="new"]{border-left:3px solid var(--cyan)}
  .fb-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .fb-tags{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .fb-pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px 9px;
    color:#aeb9c8;font-family:var(--mono);font-size:10px}
  .fb-pill.new{color:var(--cyan);border-color:rgba(34,211,238,.45)}
  .fb-pill.resolved{color:var(--up);border-color:rgba(74,222,128,.45)}
  .fb-time{color:var(--muted);font-family:var(--mono);font-size:10.5px;white-space:nowrap}
  .fb-message{margin:17px 0 13px;color:#e8edf5;font-size:14.5px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
  .fb-meta{display:flex;gap:8px 16px;flex-wrap:wrap;color:var(--muted);font-family:var(--mono);font-size:10.5px;line-height:1.6}
  .fb-meta a{color:var(--cyan)}
  .fb-editor{display:grid;grid-template-columns:140px 120px 1fr;gap:10px;margin-top:17px;padding-top:16px;border-top:1px solid var(--line)}
  .fb-editor textarea{grid-column:1/-1;min-height:74px;resize:vertical}
  .fb-links{display:grid;grid-template-columns:1fr 1fr 180px;gap:10px;grid-column:1/-1}
  .fb-actions{grid-column:1/-1;display:flex;align-items:center;gap:12px}
  .fb-save-status{font-family:var(--mono);font-size:11px;color:var(--muted)}
  @media(max-width:900px){
    .fb-summary{grid-template-columns:1fr 1fr}
    .fb-filters{grid-template-columns:1fr 1fr}
    .fb-filters input{grid-column:1/-1}
    .fb-editor{grid-template-columns:1fr 1fr}
    .fb-links{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .fb-summary,.fb-filters,.fb-editor{grid-template-columns:1fr}
    .fb-links{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header><div class="wrap nav">
  <a class="logo" href="./">Yi<b>Capital</b></a>
  <nav><ul id="m"><li><a class="link" href="admin">Admin 總覽</a></li></ul></nav>
</div></header>

<div class="wrap">
  <div class="page-hero">
    <div class="crumb">ADMIN / USER FEEDBACK</div>
    <div class="topbar">
      <h1 style="margin:0"><small>Optimization Signals · 用戶聲音</small>User Log</h1>
      <div class="who" id="who"></div>
    </div>
    <div id="adminnav"></div>
  </div>

  <div id="gate" class="card" style="text-align:center;padding:60px">
    <div class="log dim" style="display:inline-block" id="gatemsg">正在驗證會話…</div>
  </div>

  <div id="panel" style="display:none">
    <div class="fb-summary" id="summary"></div>

    <div class="card">
      <div class="topbar">
        <h3 style="margin:0">篩選與匯出</h3>
        <button class="btn2" id="export" type="button">匯出目前結果 JSON</button>
      </div>
      <div class="fb-filters">
        <input id="search" type="search" placeholder="搜索正文、頁面或用戶名">
        <select id="status">
          <option value="">全部狀態</option>
          <option value="new">New</option>
          <option value="triaged">Triaged</option>
          <option value="planned">Planned</option>
          <option value="in_progress">In progress</option>
          <option value="resolved">Resolved</option>
          <option value="dismissed">Dismissed</option>
          <option value="duplicate">Duplicate</option>
        </select>
        <select id="category">
          <option value="">全部類型</option>
          <option value="bug">功能／顯示</option>
          <option value="content">內容錯誤</option>
          <option value="data">資料錯誤</option>
          <option value="ux">使用體驗</option>
          <option value="accessibility">無障礙</option>
          <option value="performance">效能</option>
          <option value="feature">功能建議</option>
          <option value="other">其他</option>
        </select>
        <select id="locale">
          <option value="">全部語言</option>
          <option value="zh-Hant">繁中</option>
          <option value="zh-Hans">簡中</option>
          <option value="en">English</option>
        </select>
        <button class="btn" id="refresh" type="button">刷新</button>
      </div>
    </div>

    <div id="feedback" class="fb-list">
      <div class="log dim">載入中…</div>
    </div>
  </div>
</div>

<footer><div class="wrap"><div class="logo">Yi<b>Capital</b></div><p>© 2026 Yi Capital.</p></div></footer>

<script>
(function(){
  'use strict';
  const {api, $}=YCAdmin;
  const STATUS=['new','triaged','planned','in_progress','resolved','dismissed','duplicate'];
  const PRIORITY=['','p0','p1','p2','p3'];
  const STATUS_LABEL={
    new:'New',triaged:'Triaged',planned:'Planned',in_progress:'In progress',
    resolved:'Resolved',dismissed:'Dismissed',duplicate:'Duplicate'
  };
  const CATEGORY_LABEL={
    bug:'功能／顯示',content:'內容錯誤',data:'資料錯誤',ux:'使用體驗',
    accessibility:'無障礙',performance:'效能',feature:'功能建議',other:'其他'
  };
  let ITEMS=[];
  let debounce;

  YCAdmin.gate(load);
  $('refresh').onclick=load;
  ['status','category','locale'].forEach(id=>$(id).onchange=load);
  $('search').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(load,260);};
  $('export').onclick=exportJson;

  function node(tag, cls, text){
    const el=document.createElement(tag);
    if(cls)el.className=cls;
    if(text!=null)el.textContent=text;
    return el;
  }
  function stat(label,value){
    const box=node('div','fb-stat');
    box.append(node('b','',String(value||0)),node('span','',label));
    return box;
  }
  function option(value,label,selected){
    const o=document.createElement('option');
    o.value=value;o.textContent=label;o.selected=value===selected;
    return o;
  }
  function field(value,placeholder){
    const input=document.createElement('input');
    input.value=value||'';input.placeholder=placeholder;
    return input;
  }
  function safeTime(value){
    const d=new Date(value);
    return Number.isNaN(d.getTime())?String(value||''):d.toLocaleString('zh-HK',{hour12:false});
  }
  function renderSummary(summary){
    const host=$('summary');host.replaceChildren();
    const s=summary.byStatus||{};
    const active=(s.triaged||0)+(s.planned||0)+(s.in_progress||0);
    host.append(
      stat('NEW · 待分流',s.new),
      stat('ACTIVE · 處理中',active),
      stat('RESOLVED · 已解決',s.resolved),
      stat('TOTAL · 目前結果',summary.total)
    );
  }
  function render(items){
    const host=$('feedback');host.replaceChildren();
    if(!items.length){host.append(node('div','log dim','目前沒有符合條件的意見。'));return;}
    items.forEach(item=>host.append(entry(item)));
  }
  function entry(item){
    const card=node('article','fb-entry');card.dataset.status=item.status;
    const head=node('div','fb-head');
    const tags=node('div','fb-tags');
    tags.append(
      node('span','fb-pill '+item.status,STATUS_LABEL[item.status]||item.status),
      node('span','fb-pill',CATEGORY_LABEL[item.category]||item.category),
      node('span','fb-pill',item.locale),
      node('span','fb-pill',item.priority||'未定優先級')
    );
    head.append(tags,node('time','fb-time',safeTime(item.createdAt)));
    const message=node('div','fb-message',item.message);
    const meta=node('div','fb-meta');
    const page=document.createElement('a');page.href=item.pagePath;page.target='_blank';page.rel='noopener';page.textContent=item.pagePath+' ↗';
    meta.append(page);
    [
      item.pageTitle,
      item.username?('用戶：'+item.username):'匿名',
      item.release?('版本：'+item.release):'版本：—',
      item.diagnostics&&item.diagnostics.device?('裝置：'+item.diagnostics.device):'',
      item.diagnostics&&item.diagnostics.browser?('瀏覽器：'+item.diagnostics.browser):'',
      item.rating?('評分：'+item.rating+'/5'):'',
      'ID：'+item.id
    ].filter(Boolean).forEach(text=>meta.append(node('span','',text)));

    const editor=node('div','fb-editor');
    const status=document.createElement('select');
    STATUS.forEach(v=>status.append(option(v,STATUS_LABEL[v],item.status)));
    const priority=document.createElement('select');
    PRIORITY.forEach(v=>priority.append(option(v,v?v.toUpperCase():'未定優先級',item.priority||'')));
    const note=document.createElement('textarea');note.value=item.adminNote||'';note.placeholder='處理備註／判斷依據';
    const links=node('div','fb-links');
    const issue=field(item.linkedIssue,'GitHub Issue URL 或編號');
    const pr=field(item.linkedPr,'GitHub PR URL 或編號');
    const release=field(item.resolvedRelease,'修復版本');
    links.append(issue,pr,release);
    const actions=node('div','fb-actions');
    const save=node('button','btn','保存處理狀態');save.type='button';
    const saveStatus=node('span','fb-save-status','');
    save.onclick=async()=>{
      save.disabled=true;saveStatus.textContent='保存中…';
      try{
        const result=await api('/api/feedback/update',{
          method:'POST',
          body:JSON.stringify({
            id:item.id,status:status.value,priority:priority.value,
            adminNote:note.value,linkedIssue:issue.value,linkedPr:pr.value,
            resolvedRelease:release.value
          })
        });
        Object.assign(item,result.item);
        saveStatus.textContent='✓ 已保存 '+safeTime(item.updatedAt);
        card.dataset.status=item.status;
        renderSummaryFromItems();
      }catch(error){saveStatus.textContent='✗ '+error.message;}
      finally{save.disabled=false;}
    };
    actions.append(save,saveStatus);
    editor.append(status,priority,node('div','',item.fingerprint?'Fingerprint：'+item.fingerprint:''),note,links,actions);
    card.append(head,message,meta,editor);
    return card;
  }
  function renderSummaryFromItems(){
    const byStatus={};
    ITEMS.forEach(item=>{byStatus[item.status]=(byStatus[item.status]||0)+1;});
    renderSummary({total:ITEMS.length,byStatus});
  }
  async function load(){
    const host=$('feedback');
    host.replaceChildren(node('div','log dim','載入中…'));
    const params=new URLSearchParams({limit:'500'});
    ['status','category','locale'].forEach(id=>{if($(id).value)params.set(id,$(id).value);});
    if($('search').value.trim())params.set('search',$('search').value.trim());
    try{
      const result=await api('/api/feedback?'+params.toString());
      ITEMS=result.items||[];
      renderSummary(result.summary||{total:0,byStatus:{}});
      render(ITEMS);
    }catch(error){
      host.replaceChildren(node('div','log err','✗ '+error.message));
    }
  }
  function exportJson(){
    const payload={
      exportedAt:new Date().toISOString(),
      filters:{status:$('status').value,category:$('category').value,locale:$('locale').value,search:$('search').value},
      items:ITEMS
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='yicapital-user-feedback-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
})();
</script>
</body>
</html>
